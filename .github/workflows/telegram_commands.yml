name: Telegram Commands

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-commands
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-crypto.txt

      - name: Run Telegram command worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: kcex_signal_state.json
        run: |
          python telegram_commands.py

      - name: Save Telegram command state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"

          git add kcex_signal_state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update Telegram command state"
          git pull --rebase origin main
          git push origin main
